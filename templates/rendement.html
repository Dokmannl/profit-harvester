<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Rendement — Profit Harvester</title>
<meta name="theme-color" content="#0a0e14">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="icon" href="/static/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
(function () {
  var KEY = "thema";
  function lees() { try { return localStorage.getItem(KEY) === "licht" ? "licht" : "donker"; } catch (e) { return "donker"; } }
  function zet(t) {
    document.documentElement.setAttribute("data-thema", t);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) { m.setAttribute("content", t === "licht" ? "#f3f5f9" : "#0a0e14"); }
    var c = document.querySelector('meta[name="color-scheme"]');
    if (c) { c.setAttribute("content", t === "licht" ? "light" : "dark"); }
    var b = document.getElementById("knopThema");
    if (b) { b.textContent = t === "licht" ? "Donker" : "Licht"; }
  }
  zet(lees());
  document.addEventListener("DOMContentLoaded", function () {
    zet(lees());
    var b = document.getElementById("knopThema");
    if (b) { b.addEventListener("click", function () {
      var nieuw = lees() === "licht" ? "donker" : "licht";
      try { localStorage.setItem(KEY, nieuw); } catch (e) {}
      zet(nieuw);
    }); }
  });
})();
</script>
<style>
:root {
  --bg:       #0a0e14;
  --surface:  #121822;
  --surface2: #182231;
  --line:     #24303f;
  --text:     #e8eef5;
  --dim:      #8496a8;
  --dimmer:   #5d6e80;
  --up:       #35c491;
  --down:     #e8654f;
  --gold:     #f2b53b;
  --goldsoft: rgba(242, 181, 59, .09);
  --shadow:   0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
  --r:        14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: radial-gradient(1100px 500px at 15% -10%, #16202e 0%, transparent 60%), var(--bg);
  background-attachment: fixed;
  color: var(--text);
  font-family: 'Manrope', system-ui, -apple-system, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  font-variant-numeric: tabular-nums;
  padding: 24px 18px 92px;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1280px; margin: 0 auto; }

:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px rgba(242,181,59,.5); border-radius: 6px; }

/* laadstaat: een rustige glans in plaats van lege vlakken met nulwaarden */
body[data-laden] .kaart .groot, body[data-laden] .balkenvlak, body[data-laden] #topMunten {
  background: linear-gradient(90deg, var(--surface2) 25%, rgba(255,255,255,.055) 50%, var(--surface2) 75%);
  background-size: 200% 100%;
  animation: skelet 1.5s ease-in-out infinite;
  border-radius: 8px;
}
@keyframes skelet { from { background-position: 200% 0; } to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { body[data-laden] * { animation: none !important; } }
body[data-laden] .kaart .groot { color: transparent; width: 58%; }
body[data-laden] #topMunten { min-height: 150px; margin: 14px 18px 18px; }
body[data-laden] .balkenvlak { margin: 14px 18px; padding: 0; }

.rgrid { display: block; }

.kop { text-align: center; margin-bottom: 18px; }
.kop h1 { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.02em; display: flex; align-items: center; justify-content: center; gap: 8px; }
.ic { width: 16px; height: 16px; flex-shrink: 0; }

.navbalk {
  position: fixed; bottom: 0; left: 0; right: 0;
  display: flex;
  max-width: 1280px; margin: 0 auto;
  background: var(--surface);
  border-top: 1px solid var(--line);
  border-left: 1px solid var(--line);
  border-right: 1px solid var(--line);
  border-radius: var(--r) var(--r) 0 0;
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
  z-index: 40;
  box-shadow: 0 -6px 20px -10px rgba(0,0,0,.5);
}
.navbalk a {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 7px 4px 6px;
  color: var(--dimmer);
  text-decoration: none;
  font-size: 0.63rem;
  font-weight: 600;
  border-radius: 10px;
  transition: color .15s, background .15s;
}
.navbalk a svg { width: 20px; height: 20px; }
.navbalk a.actief { color: var(--gold); }
.navbalk a:hover { background: var(--surface2); color: var(--text); }
.navbalk a.actief:hover { color: var(--gold); }

.tabs {
  display: flex;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--shadow);
  padding: 5px;
  gap: 4px;
  margin-bottom: 16px;
}
.tabs button {
  flex: 1;
  font: inherit; font-size: 0.82rem; font-weight: 600;
  background: none; border: none; border-radius: 9px;
  color: var(--dim); padding: 9px 6px; cursor: pointer;
  transition: background .15s, color .15s;
}
.tabs button[aria-pressed="true"] { background: var(--surface2); color: var(--text); }

.kaarten {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}
.kaart {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--shadow);
  padding: 14px 16px;
}
.kaart .etiket { font-size: 0.73rem; color: var(--dim); margin-bottom: 5px; }
.kaart .groot { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.02em; }
.kaart .groot.op { color: var(--up); }
.kaart .groot.af { color: var(--down); }

.paneel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--shadow);
  overflow: hidden;
  margin-bottom: 16px;
}
.paneelkop {
  padding: 14px 18px;
  border-bottom: 1px solid var(--line);
  font-size: 0.95rem; font-weight: 700; letter-spacing: -0.01em;
}

.balkenvlak {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  padding: 18px 18px 14px;
  height: 130px;
}
.balk {
  flex: 1;
  min-width: 4px;
  background: linear-gradient(180deg, var(--gold), #d38f18);
  border-radius: 4px 4px 0 0;
  transition: opacity .15s;
}
.balk.leeg { background: var(--surface2); }
.balklabels {
  display: flex;
  gap: 6px;
  padding: 0 18px 16px;
  font-size: 0.68rem;
  color: var(--dimmer);
}
.balklabels span { flex: 1; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.muntrij {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 18px;
  border-bottom: 1px solid var(--line);
}
.muntrij:last-child { border-bottom: none; }
.muntrij .rang {
  width: 22px; height: 22px; flex-shrink: 0;
  border-radius: 50%;
  background: var(--surface2);
  display: grid; place-items: center;
  font-size: 0.72rem; font-weight: 700; color: var(--dim);
}
.muntrij.leeg { opacity: .55; }
.muntrij.leeg .bedrag { color: var(--dimmer); }

.muntrij.verlopen { box-shadow: inset 3px 0 0 var(--down); background: rgba(232,101,79,.05); }
.muntrij.verlopen .naam small { color: var(--down); }
.muntrij .naam { flex: 1; font-weight: 700; }
.muntrij .naam small { display: block; font-size: 0.73rem; color: var(--dimmer); font-weight: 500; margin-top: 1px; }
.muntrij .bedrag { font-weight: 700; color: var(--up); }
.muntrij .bedrag.negatief { color: var(--down); }

.geenmunten { padding: 44px 18px; text-align: center; color: var(--dim); font-size: 0.9rem; }

.onderbalk { display: flex; align-items: center; justify-content: flex-end; gap: 4px; padding: 14px 4px 0; }
.onderbalk form { margin: 0; }
a.plat {
  display: inline-flex; align-items: center;
  font: inherit; font-size: 0.85rem; font-weight: 500;
  color: var(--dim); text-decoration: none;
  background: none; border: 1px solid transparent;
  border-radius: 9px; padding: 9px 15px;
  transition: background .15s, color .15s;
}
a.plat:hover { background: var(--surface2); color: var(--text); }
button.plat {
  display: inline-flex; align-items: center;
  font: inherit; font-size: 0.85rem; font-weight: 500;
  color: var(--dim); cursor: pointer;
  background: none; border: 1px solid transparent;
  border-radius: 9px; padding: 9px 15px;
  transition: background .15s, color .15s;
}
button.plat:hover { background: var(--surface2); color: var(--text); }

@media (min-width: 1100px) {
  body { padding-left: 28px; padding-right: 28px; }
  .wrap { max-width: 1280px; }
  .kaarten { grid-template-columns: repeat(4, 1fr); }
  .rgrid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .rgrid > .paneel { margin-bottom: 0; }
  .balkenvlak { height: 220px; }
}

@media (max-width: 560px) {
  .kaarten { grid-template-columns: 1fr 1fr; }
  .kaart .groot { font-size: 1.2rem; }
}

/* ---------------- licht thema (schakelaar onderaan) ---------------- */
html[data-thema="licht"] {
  --bg: #f3f5f9; --surface: #ffffff; --surface2: #edf1f6; --line: #dbe2ea;
  --text: #16202b; --dim: #556476; --dimmer: #5f6f80;
  --up: #0b7d55; --down: #c4402b; --gold: #9a6400; --goldsoft: rgba(154,100,0,.09);
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 10px 26px -16px rgba(16,24,40,.22);
}
html[data-thema="licht"] body {
  background: radial-gradient(1100px 500px at 15% -10%, #e3eaf4 0%, transparent 60%), var(--bg);
  background-attachment: fixed;
}
html[data-thema="licht"] .skelet {
  background: linear-gradient(90deg, var(--surface2) 25%, rgba(16,24,40,.06) 50%, var(--surface2) 75%);
  background-size: 200% 100%;
}
html[data-thema="licht"] .rij:hover,
html[data-thema="licht"] table.orders tbody tr:hover td { background: rgba(16,24,40,.03); }
html[data-thema="licht"] table.orders th,
html[data-thema="licht"] .groepkop { background: rgba(16,24,40,.035); }
html[data-thema="licht"] .sprongbalk { background: rgba(243,245,249,.9); }
html[data-thema="licht"] .overlay { background: rgba(16,24,40,.45); }
html[data-thema="licht"] button:hover,
html[data-thema="licht"] button:hover:not(:disabled),
html[data-thema="licht"] .beheerknop:hover { background: var(--surface2); border-color: #c3cdd9; }
html[data-thema="licht"] button.hoofd,
html[data-thema="licht"] .weergavekaart button[aria-pressed="true"],
html[data-thema="licht"] .merk .mark { background: linear-gradient(145deg, #f2b53b, #dd9c1f); }
html[data-thema="licht"] button.hoofd:hover,
html[data-thema="licht"] button.hoofd:hover:not(:disabled),
html[data-thema="licht"] .weergavekaart button[aria-pressed="true"]:hover { background: linear-gradient(145deg, #ffc65c, #e8a622); border-color: #dd9c1f; }
html[data-thema="licht"] button.bevestig { background: var(--down); border-color: var(--down); color: #fff; }
html[data-thema="licht"] .paneel.tema-pot .paneelkop,
html[data-thema="licht"] .soort.koop { color: #2f5f99; }
html[data-thema="licht"] .sprong.pot { --kleur: #2f5f99; }
html[data-thema="licht"] .tag.boeking { color: var(--dim); background: rgba(16,24,40,.07); }
html[data-thema="licht"] .tag.koopt { background: rgba(154,100,0,.12); }
html[data-thema="licht"] .navbalk { box-shadow: 0 -6px 20px -12px rgba(16,24,40,.25); }
</style>

<script>
(function () {
  "use strict";

  var geld = new Intl.NumberFormat("nl-NL", { style: "currency", currency: "EUR" });
  var bereik = "week";

  var el = {};
  ["totaalWinst", "aantalOogsten", "gemiddelde", "totaalFees", "balkenVlak", "balkLabels", "topMunten", "topMuntenKop"].forEach(function (id) {
    el[id] = document.getElementById(id);
  });

  function naarLogin() {
    location.href = "/login?volgende=" + encodeURIComponent(location.pathname);
  }

  function labelVoorPeriode(periode) {
    // periode is "YYYY-MM-DD" of "YYYY-MM"
    var delen = periode.split("-");
    if (delen.length === 3) {
      var d = new Date(Number(delen[0]), Number(delen[1]) - 1, Number(delen[2]));
      return d.toLocaleDateString("nl-NL", { day: "numeric", month: "short" });
    }
    var d2 = new Date(Number(delen[0]), Number(delen[1]) - 1, 1);
    return d2.toLocaleDateString("nl-NL", { month: "short", year: "2-digit" });
  }

  function tekenBalken(reeks) {
    el.balkenVlak.textContent = "";
    el.balkLabels.textContent = "";

    if (!reeks.length) {
      el.balkenVlak.innerHTML = '<div class="geenmunten" style="padding:20px 0;width:100%;">Nog geen oogsten in deze periode.</div>';
      return;
    }

    // Bij "alles" kunnen het veel maanden zijn; toon de laatste 14 punten
    var punten = reeks.slice(-14);
    var max = Math.max.apply(null, punten.map(function (p) { return p.winst; }).concat([0.01]));

    punten.forEach(function (p) {
      var balk = document.createElement("div");
      var hoogtePct = Math.max(3, (p.winst / max) * 100);
      balk.className = "balk" + (p.winst <= 0 ? " leeg" : "");
      balk.style.height = hoogtePct + "%";
      balk.title = labelVoorPeriode(p.periode) + ": " + geld.format(p.winst) + " (" + p.aantal + " oogst" + (p.aantal === 1 ? "" : "en") + ")";
      el.balkenVlak.appendChild(balk);

      var label = document.createElement("span");
      label.textContent = labelVoorPeriode(p.periode);
      el.balkLabels.appendChild(label);
    });
  }

  function tekenTopMunten(top, aantalMunten) {
    el.topMunten.textContent = "";
    if (!top.length) {
      el.topMuntenKop.textContent = "Munten";
      el.topMunten.innerHTML = '<div class="geenmunten">Nog geen oogsten in deze periode.</div>';
      return;
    }
    el.topMuntenKop.textContent = "Munten (" + aantalMunten + ")";
    top.forEach(function (m, idx) {
      var rij = document.createElement("div");
      var nooitGeoogst = m.aantal === 0;
      var nietMeerInBezit = m.actief === false;
      rij.className = "muntrij" + (nooitGeoogst ? " leeg" : "") + (nietMeerInBezit ? " verlopen" : "");

      var subtekst = nooitGeoogst ? "Nog niet geoogst" : (m.aantal + ' oogst' + (m.aantal === 1 ? "" : "en"));
      if (nietMeerInBezit) { subtekst += " · niet meer in bezit"; }

      var bedragTekst = nooitGeoogst
        ? geld.format(0)
        : (m.winst >= 0 ? "+" : "−") + geld.format(Math.abs(m.winst));
      var bedragKlasse = "bedrag" + (!nooitGeoogst && m.winst < 0 ? " negatief" : "");

      rij.innerHTML =
        '<div class="rang">' + (nooitGeoogst ? "&mdash;" : (idx + 1)) + '</div>' +
        '<div class="naam">' + m.munt + '<small>' + subtekst + '</small></div>' +
        '<div class="' + bedragKlasse + '">' + bedragTekst + '</div>';
      el.topMunten.appendChild(rij);
    });
  }

  function haalRendement() {
    fetch("/api/rendement?bereik=" + bereik, { headers: { "Accept": "application/json" } })
      .then(function (r) {
        if (r.status === 401) { naarLogin(); throw new Error("niet ingelogd"); }
        if (!r.ok) { throw new Error(r.status); }
        return r.json();
      })
      .then(function (data) {
        document.body.removeAttribute("data-laden");
        el.totaalWinst.textContent = geld.format(data.totaal_winst || 0);
        el.totaalWinst.className = "groot " + (data.totaal_winst >= 0 ? "op" : "af");
        el.aantalOogsten.textContent = data.aantal_oogsten || 0;
        el.gemiddelde.textContent = geld.format(data.gemiddelde || 0);
        el.totaalFees.textContent = geld.format(data.totaal_fees || 0);
        tekenBalken(data.reeks || []);
        tekenTopMunten(data.top_munten || [], data.aantal_munten || 0);
      })
      .catch(function () { document.body.removeAttribute("data-laden"); /* stil falen */ });
  }

  document.getElementById("tabs").addEventListener("click", function (e) {
    var knop = e.target.closest("button");
    if (!knop) { return; }
    bereik = knop.dataset.bereik;
    Array.prototype.forEach.call(this.querySelectorAll("button"), function (b) {
      b.setAttribute("aria-pressed", String(b === knop));
    });
    haalRendement();
  });

  document.getElementById("knopVernieuw").addEventListener("click", haalRendement);

  haalRendement();
  setInterval(function () { if (!document.hidden) { haalRendement(); } }, 60000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) { haalRendement(); } });
})();
</script>

<script>
(function () {
  "use strict";
  var nav = document.querySelector(".navbalk");
  if (!nav) { return; }

  var css = document.createElement("style");
  css.textContent =
    ".navbalk a, .navbalk button.navknop { position: relative; }" +
    ".navbalk button.navknop { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;" +
    " padding: 7px 4px 6px; color: var(--dimmer); background: none; border: none; font: inherit; font-size: 0.66rem;" +
    " font-weight: 600; border-radius: 10px; cursor: pointer; transition: color .15s, background .15s; }" +
    ".navbalk button.navknop svg { width: 21px; height: 21px; }" +
    ".navbalk button.navknop:hover { background: var(--surface2); color: var(--text); }" +
    ".navbalk button.navknop.open { color: var(--gold); }" +
    ".navstip { position: absolute; top: 5px; left: calc(50% + 6px); width: 9px; height: 9px; border-radius: 50%;" +
    " background: var(--down); box-shadow: 0 0 0 2px var(--surface); }" +
    ".navstip[hidden] { display: none; }" +
    ".meldpaneel { position: fixed; z-index: 45; bottom: 74px; right: 14px; width: min(420px, calc(100vw - 28px));" +
    " max-height: min(60vh, 520px); display: flex; flex-direction: column; background: var(--surface);" +
    " border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }" +
    ".meldpaneel[hidden] { display: none; }" +
    ".meldkop { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px;" +
    " border-bottom: 1px solid var(--line); font-weight: 700; font-size: 0.92rem; }" +
    ".meldkop label { font-weight: 500; font-size: 0.76rem; color: var(--dim); display: flex; align-items: center; gap: 6px; cursor: pointer; }" +
    ".meldlijst { overflow-y: auto; }" +
    ".meld { padding: 10px 16px; border-bottom: 1px solid var(--line); font-size: 0.84rem; line-height: 1.45;" +
    " border-left: 3px solid transparent; white-space: pre-line; word-break: break-word; }" +
    ".meld:last-child { border-bottom: none; }" +
    ".meld.belangrijk { border-left-color: var(--down); background: rgba(232,101,79,.07); }" +
    ".meld small { display: block; color: var(--dimmer); font-size: 0.7rem; margin-bottom: 2px; }" +
    ".meldleeg { padding: 28px 16px; text-align: center; color: var(--dim); font-size: 0.86rem; }";
  document.head.appendChild(css);

  var knop = document.createElement("button");
  knop.type = "button";
  knop.className = "navknop";
  knop.id = "navMeldingen";
  knop.setAttribute("aria-label", "Meldingen");
  knop.innerHTML =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9Z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>' +
    'Meldingen<i class="navstip" hidden></i>';
  nav.appendChild(knop);
  var stip = knop.querySelector(".navstip");

  var paneel = document.createElement("div");
  paneel.className = "meldpaneel";
  paneel.hidden = true;
  paneel.setAttribute("role", "dialog");
  paneel.setAttribute("aria-label", "Meldingen");
  paneel.innerHTML =
    '<div class="meldkop"><span>Meldingen</span>' +
    '<label><input type="checkbox" id="meldAlleenBelangrijk"> Alleen belangrijk</label></div>' +
    '<div class="meldlijst" id="meldLijst"></div>';
  document.body.appendChild(paneel);
  var lijst = paneel.querySelector("#meldLijst");
  var alleenBelangrijk = paneel.querySelector("#meldAlleenBelangrijk");

  var laatsteData = null;

  function tijdTekst(t) {
    var d = new Date(t * 1000), nu = new Date();
    var tijd = d.toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" });
    if (d.toDateString() === nu.toDateString()) { return "Vandaag " + tijd; }
    return d.toLocaleDateString("nl-NL", { day: "numeric", month: "short" }) + " " + tijd;
  }

  function teken() {
    lijst.textContent = "";
    var items = (laatsteData && laatsteData.meldingen) || [];
    if (alleenBelangrijk.checked) { items = items.filter(function (m) { return m.niveau === "belangrijk"; }); }
    if (!items.length) {
      var leeg = document.createElement("div");
      leeg.className = "meldleeg";
      leeg.textContent = alleenBelangrijk.checked ? "Geen belangrijke meldingen. Rustig." : "Nog geen meldingen.";
      lijst.appendChild(leeg);
      return;
    }
    items.forEach(function (m) {
      var rij = document.createElement("div");
      rij.className = "meld" + (m.niveau === "belangrijk" ? " belangrijk" : "");
      var klein = document.createElement("small");
      klein.textContent = tijdTekst(m.t);
      var tekst = document.createElement("span");
      tekst.textContent = m.tekst;
      rij.appendChild(klein); rij.appendChild(tekst);
      lijst.appendChild(rij);
    });
  }

  function haal(markeerGelezen) {
    return fetch("/api/meldingen", { headers: { "Accept": "application/json" }, credentials: "same-origin" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) {
        if (!data) { return; }
        laatsteData = data;
        stip.hidden = !(data.ongelezen_belangrijk > 0) || markeerGelezen === true;
        if (!paneel.hidden) { teken(); }
      })
      .catch(function () {});
  }

  function markeerGelezen() {
    fetch("/api/meldingen/gelezen", { method: "POST", credentials: "same-origin" }).catch(function () {});
    stip.hidden = true;
  }

  function sluit() { paneel.hidden = true; knop.classList.remove("open"); }

  knop.addEventListener("click", function (e) {
    e.stopPropagation();
    if (!paneel.hidden) { sluit(); return; }
    paneel.hidden = false;
    knop.classList.add("open");
    teken();
    haal(true).then(function () { teken(); markeerGelezen(); });
  });
  paneel.addEventListener("click", function (e) { e.stopPropagation(); });
  alleenBelangrijk.addEventListener("change", teken);
  document.addEventListener("click", sluit);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { sluit(); } });

  haal();
  setInterval(function () { if (!document.hidden && paneel.hidden) { haal(); } }, 30000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden && paneel.hidden) { haal(); } });
})();
</script>
</body>
</html>
