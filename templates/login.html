<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Inloggen — Profit Harvester</title>
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#0a0e14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Harvester">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="icon" href="/static/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #0a0e14;
  --surface:  #121822;
  --surface2: #182231;
  --line:     #24303f;
  --text:     #e8eef5;
  --dim:      #8496a8;
  --dimmer:   #5d6e80;
  --down:     #e8654f;
  --gold:     #f2b53b;
  --shadow:   0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
  --r:        14px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background:
    radial-gradient(1100px 500px at 15% -10%, #16202e 0%, transparent 60%),
    var(--bg);
  background-attachment: fixed;
  color: var(--text);
  font-family: 'Manrope', system-ui, -apple-system, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
}

:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 6px; }

.kaart {
  width: 100%;
  max-width: 360px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--shadow);
  padding: 28px 26px;
}

.merk { display: flex; align-items: center; gap: 11px; margin-bottom: 22px; }

.merk .mark {
  width: 34px; height: 34px;
  border-radius: 9px;
  background: linear-gradient(145deg, var(--gold), #d38f18);
  display: grid; place-items: center;
  color: #1a1206; font-weight: 800; font-size: 0.98rem;
  box-shadow: 0 4px 14px -6px rgba(242,181,59,.8);
  flex-shrink: 0;
}

.merk h1 { font-size: 1.02rem; font-weight: 700; letter-spacing: -0.02em; }
.merk span { display: block; font-size: 0.72rem; color: var(--dimmer); font-weight: 500; }

label {
  display: block;
  font-size: 0.82rem;
  color: var(--dim);
  margin-bottom: 8px;
}

input[type="password"] {
  font: inherit; font-size: 0.95rem;
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 9px;
  color: var(--text);
  padding: 11px 13px;
  margin-bottom: 16px;
}

input[type="password"]::placeholder { color: var(--dimmer); }
input[type="password"]:focus { border-color: var(--gold); }

button {
  font: inherit;
  font-size: 0.9rem;
  font-weight: 700;
  width: 100%;
  background: linear-gradient(145deg, var(--gold), #dd9c1f);
  border: 1px solid #dd9c1f;
  color: #1a1206;
  border-radius: 9px;
  padding: 11px;
  cursor: pointer;
  transition: background .15s;
}

button:hover { background: linear-gradient(145deg, #ffc65c, #e8a622); }

.fout {
  background: rgba(232,101,79,.12);
  border: 1px solid rgba(232,101,79,.32);
  color: var(--down);
  border-radius: 9px;
  padding: 10px 13px;
  font-size: 0.83rem;
  margin-bottom: 16px;
}
</style>
</head>
<body>
  <div class="kaart">
    <div class="merk">
      <div class="mark">PH</div>
      <div>
        <h1>Profit Harvester</h1>
        <span>Bitvavo</span>
      </div>
    </div>
    <form method="post" action="/login">
      {% if volgende %}<input type="hidden" name="volgende" value="{{ volgende }}">{% endif %}
      {% if fout %}<div class="fout">{{ fout }}</div>{% endif %}
      <label for="wachtwoord">Wachtwoord</label>
      <input type="password" id="wachtwoord" name="wachtwoord" autocomplete="current-password" autofocus>
      <button type="submit">Inloggen</button>
    </form>
  </div>
</body>
</html>
