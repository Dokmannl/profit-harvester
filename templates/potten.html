<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Potten — Profit Harvester</title>
<meta name="theme-color" content="#0a0e14">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="icon" href="/static/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
(function () {
  var KEY = "thema";
  function lees() { try { return localStorage.getItem(KEY) === "licht" ? "licht" : "donker"; } catch (e) { return "donker"; } }
  function zet(t) {
    document.documentElement.setAttribute("data-thema", t);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) { m.setAttribute("content", t === "licht" ? "#f3f5f9" : "#0a0e14"); }
    var c = document.querySelector('meta[name="color-scheme"]');
    if (c) { c.setAttribute("content", t === "licht" ? "light" : "dark"); }
    var b = document.getElementById("knopThema");
    if (b) { b.textContent = t === "licht" ? "Donker" : "Licht"; }
  }
  zet(lees());
  document.addEventListener("DOMContentLoaded", function () {
    zet(lees());
    var b = document.getElementById("knopThema");
    if (b) { b.addEventListener("click", function () {
      var nieuw = lees() === "licht" ? "donker" : "licht";
      try { localStorage.setItem(KEY, nieuw); } catch (e) {}
      zet(nieuw);
    }); }
  });
})();
</script>
<style>
:root {
  --bg:       #0a0e14;
  --surface:  #121822;
  --surface2: #182231;
  --line:     #24303f;
  --text:     #e8eef5;
  --dim:      #8496a8;
  --dimmer:   #5d6e80;
  --up:       #35c491;
  --down:     #e8654f;
  --gold:     #f2b53b;
  --goldsoft: rgba(242, 181, 59, .09);
  --shadow:   0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
  --r:        14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
body {
  background: radial-gradient(1100px 500px at 15% -10%, #16202e 0%, transparent 60%), var(--bg);
  background-attachment: fixed;
  color: var(--text);
  font-family: 'Manrope', system-ui, -apple-system, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  font-variant-numeric: tabular-nums;
  padding: 24px 18px 92px;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1280px; margin: 0 auto; }
:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px rgba(242,181,59,.5); border-radius: 6px; }

/* laadstaat: een rustige glans in plaats van lege vlakken met nulwaarden */
.skelet, body[data-laden] .strategiekaart .sk-waarde, body[data-laden] .strategiekaart .sk-sub, body[data-laden] .strategiekaart .sk-munten {
  background: linear-gradient(90deg, var(--surface2) 25%, rgba(255,255,255,.055) 50%, var(--surface2) 75%);
  background-size: 200% 100%;
  animation: skelet 1.5s ease-in-out infinite;
  border-radius: 8px;
}
@keyframes skelet { from { background-position: 200% 0; } to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .skelet, body[data-laden] .strategiekaart * { animation: none !important; } }
body[data-laden] .strategiekaart .sk-waarde, body[data-laden] .strategiekaart .sk-sub, body[data-laden] .strategiekaart .sk-munten { color: transparent; }
body[data-laden] .strategiekaart .sk-waarde { width: 62%; }
body[data-laden] .strategiekaart .sk-sub { width: 44%; min-height: 1.1em; }
body[data-laden] .strategiekaart .sk-munten { width: 28%; min-height: 1em; }
.laadpaneel { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
.laadpaneel .skelet { height: 46px; }

.kop { text-align: center; margin-bottom: 18px; }
.kop h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.02em; display: flex; align-items: center; justify-content: center; gap: 8px; }
.ic { width: 15px; height: 15px; flex-shrink: 0; vertical-align: -2px; }
.kop h1 .ic { width: 17px; height: 17px; }

/* ---------------- strategiekaarten ---------------- */

.strategiekaarten {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}
.strategiekaart {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--shadow);
  padding: 16px 18px;
}
.strategiekaart .sk-naam { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; color: var(--dim); font-weight: 600; margin-bottom: 6px; }
.strategiekaart .sk-naam svg { width: 14px; height: 14px; flex-shrink: 0; }
.strategiekaart .sk-waarde { font-size: 1.45rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
.strategiekaart .sk-sub { font-size: 0.78rem; margin-top: 5px; }
.strategiekaart .sk-sub.op { color: var(--up); }
.strategiekaart .sk-sub.af { color: var(--down); }
.strategiekaart .sk-munten { font-size: 0.73rem; color: var(--dimmer); margin-top: 3px; }
.strategiekaart.hoofdlijst { border-color: rgba(242,181,59,.3); }
.strategiekaart.pot { border-color: rgba(61,110,168,.4); }
.strategiekaart.dalpot { border-color: rgba(232,101,79,.35); }

/* ---------------- panelen (hergebruikt patroon) ---------------- */

.paneel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--shadow);
  overflow: hidden;
  margin-bottom: 16px;
}
.paneelkop {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; flex-wrap: wrap;
  padding: 14px 18px;
  border-bottom: 1px solid var(--line);
}
.paneelkop h2 { font-size: 0.95rem; font-weight: 700; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
.paneelkop h2 .ic { width: 15px; height: 15px; }

.noodstopchip {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(232,101,79,.14);
  color: var(--down);
  border: 1px solid rgba(232,101,79,.32);
  border-radius: 99px;
  padding: 3px 10px;
  font-size: 0.74rem; font-weight: 600;
  margin-left: 8px;
}

.potcijfers {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  padding: 2px 18px 16px;
  border-bottom: 1px solid var(--line);
}
.potcijfers .etiket { display: block; font-size: 0.72rem; color: var(--dim); margin-bottom: 3px; }
.potcijfers strong { font-size: 1.08rem; font-weight: 700; letter-spacing: -0.02em; }

.rij {
  display: grid;
  grid-template-columns: 34px minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, .8fr) minmax(150px, 1.5fr);
  gap: 14px;
  align-items: center;
  padding: 14px 18px;
  border-bottom: 1px solid var(--line);
  transition: background .15s;
  cursor: pointer;
}
.pijl { width: 12px; height: 12px; vertical-align: -1px; margin-left: 4px; color: var(--dimmer); flex-shrink: 0; transition: transform .18s ease; }
.rij.uitgeklapt .pijl { transform: rotate(90deg); }
.rij:last-child { border-bottom: none; }
.rij:hover { background: rgba(255,255,255,.017); }
.rij.klaar { background: var(--goldsoft); box-shadow: inset 3px 0 0 var(--gold); }
.rij.klaar:hover { background: rgba(242,181,59,.13); }

.logo { width: 30px; height: 30px; border-radius: 50%; object-fit: contain; background: var(--surface2); }
.valtterug { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--surface2); color: var(--dim); font-size: 0.66rem; font-weight: 700; }

.naam { font-weight: 700; letter-spacing: -0.01em; }
.naam small { display: none; font-size: 0.73rem; color: var(--dimmer); font-weight: 500; line-height: 1.5; }
.bedrag { font-weight: 600; }
.bedrag small { display: none; font-size: 0.73rem; color: var(--dimmer); font-weight: 500; }
.rij.uitgeklapt .naam small, .rij.uitgeklapt .bedrag small { display: block; }

.winst { font-weight: 700; }
.winst small { display: block; font-size: 0.73rem; font-weight: 600; opacity: .8; }
.op { color: var(--up); }
.af { color: var(--down); }
.winst.wacht { color: var(--dimmer); font-weight: 600; }
.winst.wacht small { font-weight: 500; opacity: 1; }

.spoorregel { display: flex; justify-content: space-between; gap: 8px; font-size: 0.73rem; color: var(--dim); margin-bottom: 6px; }
.spoorregel b { color: var(--gold); font-weight: 600; }
.spoor { position: relative; height: 6px; background: var(--bg); border-radius: 99px; overflow: hidden; }
.spoor i { position: absolute; inset: 0 auto 0 0; display: block; border-radius: 99px; background: var(--up); transition: width .5s ease; }
.spoor i.vol { background: linear-gradient(90deg, var(--up), var(--gold)); }
.spoor.onder { background: rgba(232,101,79,.18); }

.potstatus { margin-top: 7px; font-size: 0.73rem; color: var(--dimmer); }
.geenmunten { padding: 44px 18px; text-align: center; color: var(--dim); font-size: 0.9rem; }

.onderbalk { display: flex; align-items: center; justify-content: flex-end; gap: 4px; padding: 14px 4px 0; }
.onderbalk form { margin: 0; }

button {
  font: inherit; font-size: 0.85rem; font-weight: 600;
  color: var(--text); background: var(--surface2);
  border: 1px solid var(--line); border-radius: 9px;
  padding: 9px 15px; cursor: pointer;
  transition: background .15s, border-color .15s, transform .08s;
}
button:hover:not(:disabled) { background: #1f2c3d; border-color: #33475d; }
button:active:not(:disabled) { transform: translateY(1px); }
button.plat { background: none; border-color: transparent; color: var(--dim); font-weight: 500; }
button.plat:hover:not(:disabled) { background: var(--surface2); color: var(--text); }
a.plat {
  display: inline-flex; align-items: center;
  font: inherit; font-size: 0.85rem; font-weight: 500;
  color: var(--dim); text-decoration: none;
  background: none; border: 1px solid transparent;
  border-radius: 9px; padding: 9px 15px;
  transition: background .15s, color .15s;
}
a.plat:hover { background: var(--surface2); color: var(--text); }

.rijkop {
  display: grid;
  grid-template-columns: 34px minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, .8fr) minmax(150px, 1.5fr);
  gap: 14px;
  padding: 9px 18px;
  border-bottom: 1px solid var(--line);
  font-size: 0.68rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  color: var(--dimmer);
}

/* Getallen rechts uitgelijnd, zodat de cijfers netjes onder elkaar staan */
.rij > .bedrag, .rij > .winst { text-align: right; }
.rijkop span:nth-child(3), .rijkop span:nth-child(4) { text-align: right; }

.potgrid { display: block; }

@media (min-width: 1100px) {
  body { padding-left: 28px; padding-right: 28px; }
  .wrap { max-width: 1280px; }

  /* pot en dalpot naast elkaar, met dezelfde compacte rij als op een telefoon */
  .potgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
  .potgrid > .paneel { margin-bottom: 0; }
  .potgrid .rijkop { display: none; }
  .potgrid .rij {
    grid-template-columns: 34px 1fr auto;
    grid-template-areas:
      "logo naam  winst"
      "logo bedr  winst"
      "spoor spoor spoor";
    gap: 2px 12px;
    padding: 15px 16px;
  }
  .potgrid .rij > .logowrap { grid-area: logo; align-self: start; }
  .potgrid .rij > .naam     { grid-area: naam; }
  .potgrid .rij > .bedrag   { grid-area: bedr; font-size: 0.88rem; text-align: left; }
  .potgrid .rij > .winst    { grid-area: winst; text-align: right; }
  .potgrid .rij > .voortgang{ grid-area: spoor; margin-top: 11px; }
}

@media (max-width: 700px) {
  .rijkop { display: none; }
  body { padding: 16px 12px 48px; }
  .strategiekaarten { grid-template-columns: 1fr; }
  .potcijfers { padding: 2px 14px 14px; gap: 8px; }
  .potcijfers strong { font-size: 0.95rem; }

  .rij {
    grid-template-columns: 34px 1fr auto;
    grid-template-areas:
      "logo naam  winst"
      "logo bedr  winst"
      "spoor spoor spoor";
    gap: 2px 12px;
    padding: 15px 15px;
  }
  .rij > .logowrap { grid-area: logo; align-self: start; }
  .rij > .naam     { grid-area: naam; }
  .rij > .bedrag   { grid-area: bedr; font-size: 0.88rem; text-align: left; }
  .rij > .winst    { grid-area: winst; text-align: right; }
  .rij > .voortgang{ grid-area: spoor; margin-top: 11px; }
}

/* ---------------- navigatiebalk ---------------- */

.navbalk {
  position: fixed; bottom: 0; left: 0; right: 0;
  display: flex;
  max-width: 1280px; margin: 0 auto;
  background: var(--surface);
  border-top: 1px solid var(--line);
  border-left: 1px solid var(--line);
  border-right: 1px solid var(--line);
  border-radius: var(--r) var(--r) 0 0;
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
  z-index: 40;
  box-shadow: 0 -6px 20px -10px rgba(0,0,0,.5);
}
.navbalk a {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 7px 4px 6px;
  color: var(--dimmer);
  text-decoration: none;
  font-size: 0.66rem;
  font-weight: 600;
  border-radius: 10px;
  transition: color .15s, background .15s;
}
.navbalk a svg { width: 21px; height: 21px; }
.navbalk a.actief { color: var(--gold); }
.navbalk a:hover { background: var(--surface2); color: var(--text); }
.navbalk a.actief:hover { color: var(--gold); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ---------------- licht thema (schakelaar onderaan) ---------------- */
html[data-thema="licht"] {
  --bg: #f3f5f9; --surface: #ffffff; --surface2: #edf1f6; --line: #dbe2ea;
  --text: #16202b; --dim: #556476; --dimmer: #5f6f80;
  --up: #0b7d55; --down: #c4402b; --gold: #9a6400; --goldsoft: rgba(154,100,0,.09);
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 10px 26px -16px rgba(16,24,40,.22);
}
html[data-thema="licht"] body {
  background: radial-gradient(1100px 500px at 15% -10%, #e3eaf4 0%, transparent 60%), var(--bg);
  background-attachment: fixed;
}
html[data-thema="licht"] .skelet {
  background: linear-gradient(90deg, var(--surface2) 25%, rgba(16,24,40,.06) 50%, var(--surface2) 75%);
  background-size: 200% 100%;
}
html[data-thema="licht"] .rij:hover,
html[data-thema="licht"] table.orders tbody tr:hover td { background: rgba(16,24,40,.03); }
html[data-thema="licht"] table.orders th,
html[data-thema="licht"] .groepkop { background: rgba(16,24,40,.035); }
html[data-thema="licht"] .sprongbalk { background: rgba(243,245,249,.9); }
html[data-thema="licht"] .overlay { background: rgba(16,24,40,.45); }
html[data-thema="licht"] button:hover,
html[data-thema="licht"] button:hover:not(:disabled),
html[data-thema="licht"] .beheerknop:hover { background: var(--surface2); border-color: #c3cdd9; }
html[data-thema="licht"] button.hoofd,
html[data-thema="licht"] .weergavekaart button[aria-pressed="true"],
html[data-thema="licht"] .merk .mark { background: linear-gradient(145deg, #f2b53b, #dd9c1f); }
html[data-thema="licht"] button.hoofd:hover,
html[data-thema="licht"] button.hoofd:hover:not(:disabled),
html[data-thema="licht"] .weergavekaart button[aria-pressed="true"]:hover { background: linear-gradient(145deg, #ffc65c, #e8a622); border-color: #dd9c1f; }
html[data-thema="licht"] button.bevestig { background: var(--down); border-color: var(--down); color: #fff; }
html[data-thema="licht"] .paneel.tema-pot .paneelkop,
html[data-thema="licht"] .soort.koop { color: #2f5f99; }
html[data-thema="licht"] .sprong.pot { --kleur: #2f5f99; }
html[data-thema="licht"] .tag.boeking { color: var(--dim); background: rgba(16,24,40,.07); }
html[data-thema="licht"] .tag.koopt { background: rgba(154,100,0,.12); }
html[data-thema="licht"] .navbalk { box-shadow: 0 -6px 20px -12px rgba(16,24,40,.25); }
</style>
</head>

<script>
(function () {
  "use strict";

  var VERVERS_MS = 10000;
  var RESERVE_LOGO = "https://cdn.jsdelivr.net/npm/cryptocurrency-icons@0.18.1/128/color/";

  var geld = new Intl.NumberFormat("nl-NL", { style: "currency", currency: "EUR" });
  var pct = new Intl.NumberFormat("nl-NL", { minimumFractionDigits: 1, maximumFractionDigits: 1 });

  function koersTekst(koers) {
    if (!koers) { return "&nbsp;"; }
    var cijfers = koers >= 1 ? 2 : (koers >= 0.01 ? 4 : 8);
    return "koers € " + new Intl.NumberFormat("nl-NL", {
      minimumFractionDigits: 2, maximumFractionDigits: cijfers
    }).format(koers);
  }

  var el = {};
  ["hlWaarde", "hlWinst", "hlMunten", "potWaarde", "potWinst", "potMunten",
   "dalpotWaarde", "dalpotWinst", "dalpotMunten",
   "potPaneel", "potNoodstopChip", "potTotaal", "potCash", "potLijst",
   "dalpotPaneel", "dalpotNoodstopChip", "dalpotTotaal", "dalpotCash", "dalpotLijst"
  ].forEach(function (id) { el[id] = document.getElementById(id); });

  var laatste = null;
  var uitgeklapt = new Set();

  function zetToggel(rij, coin) {
    rij.addEventListener("click", function () {
      if (uitgeklapt.has(coin)) {
        uitgeklapt.delete(coin);
        rij.classList.remove("uitgeklapt");
      } else {
        uitgeklapt.add(coin);
        rij.classList.add("uitgeklapt");
      }
    });
  }

  function klem(n, a, b) { return Math.max(a, Math.min(b, n)); }

  function logoHtml(p) {
    var reserve = RESERVE_LOGO + p.coin.toLowerCase() + ".png";
    var bron = p.icoon || reserve;
    var stap = p.icoon ? "1" : "2";
    return '<img class="logo" alt="" loading="lazy" src="' + bron +
           '" data-coin="' + p.coin + '" data-reserve="' + reserve + '" data-stap="' + stap + '">';
  }

  function koppelLogo(img) {
    img.addEventListener("error", function () {
      if (img.dataset.stap === "1") {
        img.dataset.stap = "2";
        img.src = img.dataset.reserve;
        return;
      }
      var blok = document.createElement("div");
      blok.className = "valtterug";
      blok.textContent = img.dataset.coin.slice(0, 4);
      if (img.parentNode) { img.parentNode.replaceChild(blok, img); }
    });
  }

  function isKlaar(p) { return p.voortgang >= 100 || p.status === "PUMPING"; }

  function rijHtml(p, klaar, extra) {
    var winst = p.winst || 0;
    var tekort = (p.doel_eur || 0) - winst;
    var breedte = klem(p.voortgang || 0, 0, 100);
    var nietGekocht = p.waarde !== undefined && p.waarde < 1 && !klaar;

    var links = nietGekocht
      ? "Nog niet gekocht"
      : (klaar ? "<b>Volgt de top</b>" : (winst < 0 ? "Onder budget" : "Onderweg"));
    var rechts = nietGekocht
      ? "budget " + geld.format(p.budget)
      : (klaar ? geld.format(winst) + " te oogsten" : "nog " + geld.format(tekort));

    var vulKlasse = klaar ? "vol" : "";
    var vulBreedte = nietGekocht ? 0 : (winst < 0 ? 0 : breedte);
    var baanKlasse = (!nietGekocht && winst < 0) ? " onder" : "";

    var toonIngelegd = p.ingelegd > 0 && !nietGekocht && Math.abs(p.ingelegd - p.budget) >= 0.01;
    var detailRegels = [geld.format(p.budget) + ' budget'];
    if (toonIngelegd) { detailRegels.push(geld.format(p.ingelegd) + ' ingelegd'); }
    if (p.geoogst) { detailRegels.push(geld.format(p.geoogst) + ' geoogst'); }

    var winstHtml = nietGekocht
      ? '<div class="winst wacht">&mdash;<small>wacht op aankoop</small></div>'
      : '<div class="winst ' + (winst >= 0 ? "op" : "af") + '">' +
          (winst >= 0 ? "+" : "−") + geld.format(Math.abs(winst)) +
          '<small>' + (p.rendement >= 0 ? "+" : "−") + pct.format(Math.abs(p.rendement)) + '%</small></div>';

    return '' +
      '<div class="logowrap">' + logoHtml(p) + '</div>' +
      '<div class="naam">' + p.coin +
        '<svg class="pijl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>' +
        '<small>' + detailRegels.join('<br>') + '</small></div>' +
      '<div class="bedrag">' + geld.format(p.waarde) +
        '<small>' + koersTekst(p.koers) + '</small></div>' +
      winstHtml +
      '<div class="voortgang">' +
        '<div class="spoorregel"><span>' + links + '</span><span>' + rechts + '</span></div>' +
        '<div class="spoor' + baanKlasse + '"><i class="' + vulKlasse + '" style="width:' + vulBreedte + '%"></i></div>' +
        (extra || '') +
      '</div>';
  }

  function potKoopStatusTekst(p) {
    if (p.op_slot) { return "Inlegplafond bereikt, geen aankopen meer"; }
    if (p.kan_kopen_om) { return "Kan weer bijkopen om " + p.kan_kopen_om; }
    return "Kan nu bijkopen als er een dip is";
  }

  function potRijHtml(p) {
    var klaar = isKlaar(p);
    var status = '<div class="potstatus">' + potKoopStatusTekst(p) + '</div>';
    return rijHtml(p, klaar, status);
  }

  function tekenLijst(lijst, posities, magPot) {
    lijst.textContent = "";
    if (!posities.length) { return; }
    lijst.insertAdjacentHTML("beforeend",
      '<div class="rijkop"><span></span><span>Munt</span><span>Waarde</span><span>Winst</span><span>Voortgang</span></div>');
    posities.forEach(function (p) {
      var klaar = isKlaar(p);
      var rij = document.createElement("div");
      rij.className = "rij" + (klaar ? " klaar" : "") + (uitgeklapt.has(p.coin) ? " uitgeklapt" : "");
      rij.innerHTML = magPot ? potRijHtml(p) : rijHtml(p, klaar);
      lijst.appendChild(rij);
      zetToggel(rij, p.coin);
      var img = rij.querySelector("img.logo");
      if (img) { koppelLogo(img); }
    });
  }

  function samenvatting(waardeEl, winstEl, muntenEl, totaalWaarde, somWinst, somBudget, aantal) {
    waardeEl.textContent = geld.format(totaalWaarde);
    if (somBudget > 0) {
      var rend = (somWinst / somBudget) * 100;
      winstEl.className = "sk-sub " + (somWinst >= 0 ? "op" : "af");
      winstEl.textContent = (somWinst >= 0 ? "+" : "−") + geld.format(Math.abs(somWinst)) +
        " (" + (rend >= 0 ? "+" : "−") + pct.format(Math.abs(rend)) + "%)";
    } else {
      winstEl.textContent = "";
    }
    muntenEl.textContent = aantal + " munt" + (aantal === 1 ? "" : "en");
  }

  function klaarMetLaden() {
    document.body.removeAttribute("data-laden");
    var laad = document.getElementById("laadPaneel");
    if (laad) { laad.hidden = true; }
  }

  function teken(data) {
    laatste = data;
    klaarMetLaden();
    var posities = data.posities || [];
    var pot = data.pot || { posities: [] };
    var dalpot = data.dalpot || { posities: [] };

    var hlWaarde = 0, hlWinst = 0, hlBudget = 0;
    posities.forEach(function (p) {
      hlWaarde += p.waarde || 0;
      hlWinst += p.winst || 0;
      hlBudget += p.budget || 0;
    });
    samenvatting(el.hlWaarde, el.hlWinst, el.hlMunten, hlWaarde, hlWinst, hlBudget, posities.length);

    var potWaarde = pot.totaal || 0, potWinst = 0, potBudget = 0;
    (pot.posities || []).forEach(function (p) { potWinst += p.winst || 0; potBudget += p.budget || 0; });
    samenvatting(el.potWaarde, el.potWinst, el.potMunten, potWaarde, potWinst, potBudget, (pot.posities || []).length);

    var dalpotWaarde = dalpot.totaal || 0, dalpotWinst = 0, dalpotBudget = 0;
    (dalpot.posities || []).forEach(function (p) { dalpotWinst += p.winst || 0; dalpotBudget += p.budget || 0; });
    samenvatting(el.dalpotWaarde, el.dalpotWinst, el.dalpotMunten, dalpotWaarde, dalpotWinst, dalpotBudget, (dalpot.posities || []).length);

    // Pot-paneel
    var potHeeftData = (pot.posities || []).length > 0 || (pot.cash || 0) > 0 || (pot.gestort || 0) > 0;
    el.potPaneel.hidden = !potHeeftData;
    if (potHeeftData) {
      el.potTotaal.textContent = geld.format(pot.totaal || 0);
      el.potCash.textContent = geld.format(pot.cash || 0);
      el.potNoodstopChip.hidden = !pot.noodstop;
      if (!pot.posities.length) {
        el.potLijst.innerHTML = '<div class="geenmunten">Nog geen pot-munten.</div>';
      } else {
        tekenLijst(el.potLijst, pot.posities, true);
      }
    }

    // Dalpot-paneel
    var dalpotHeeftData = (dalpot.posities || []).length > 0 || (dalpot.cash || 0) > 0 || (dalpot.gestort || 0) > 0;
    el.dalpotPaneel.hidden = !dalpotHeeftData;
    if (dalpotHeeftData) {
      el.dalpotTotaal.textContent = geld.format(dalpot.totaal || 0);
      el.dalpotCash.textContent = geld.format(dalpot.cash || 0);
      el.dalpotNoodstopChip.hidden = !dalpot.noodstop;
      if (!dalpot.posities.length) {
        el.dalpotLijst.innerHTML = '<div class="geenmunten">Nog geen dalpot-munten.</div>';
      } else {
        tekenLijst(el.dalpotLijst, dalpot.posities, false);
      }
    }
  }

  function naarLogin() {
    location.href = "/login?volgende=" + encodeURIComponent(location.pathname);
  }

  var bezig = false;
  function haalData() {
    if (bezig) { return; }
    bezig = true;
    fetch("/api/data", { headers: { "Accept": "application/json" } })
      .then(function (r) {
        if (r.status === 401) { naarLogin(); throw new Error("niet ingelogd"); }
        if (!r.ok) { throw new Error(r.status); }
        return r.json();
      })
      .then(function (data) { teken(data); })
      .catch(function () { klaarMetLaden(); /* stil falen, blijft laatste stand tonen */ })
      .then(function () { bezig = false; });
  }

  document.getElementById("knopVernieuw").addEventListener("click", haalData);

  haalData();
  setInterval(function () { if (!document.hidden) { haalData(); } }, VERVERS_MS);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) { haalData(); } });
})();
</script>
<!-- meldingen -->
<script>
(function () {
  "use strict";
  var nav = document.querySelector(".navbalk");
  if (!nav) { return; }

  var css = document.createElement("style");
  css.textContent =
    ".navbalk a, .navbalk button.navknop { position: relative; }" +
    ".navbalk button.navknop { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;" +
    " padding: 7px 4px 6px; color: var(--dimmer); background: none; border: none; font: inherit; font-size: 0.66rem;" +
    " font-weight: 600; border-radius: 10px; cursor: pointer; transition: color .15s, background .15s; }" +
    ".navbalk button.navknop svg { width: 21px; height: 21px; }" +
    ".navbalk button.navknop:hover { background: var(--surface2); color: var(--text); }" +
    ".navbalk button.navknop.open { color: var(--gold); }" +
    ".navstip { position: absolute; top: 5px; left: calc(50% + 6px); width: 9px; height: 9px; border-radius: 50%;" +
    " background: var(--down); box-shadow: 0 0 0 2px var(--surface); }" +
    ".navstip[hidden] { display: none; }" +
    ".meldpaneel { position: fixed; z-index: 45; bottom: 74px; right: 14px; width: min(420px, calc(100vw - 28px));" +
    " max-height: min(60vh, 520px); display: flex; flex-direction: column; background: var(--surface);" +
    " border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }" +
    ".meldpaneel[hidden] { display: none; }" +
    ".meldkop { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px;" +
    " border-bottom: 1px solid var(--line); font-weight: 700; font-size: 0.92rem; }" +
    ".meldkop label { font-weight: 500; font-size: 0.76rem; color: var(--dim); display: flex; align-items: center; gap: 6px; cursor: pointer; }" +
    ".meldlijst { overflow-y: auto; }" +
    ".meld { padding: 10px 16px; border-bottom: 1px solid var(--line); font-size: 0.84rem; line-height: 1.45;" +
    " border-left: 3px solid transparent; white-space: pre-line; word-break: break-word; }" +
    ".meld:last-child { border-bottom: none; }" +
    ".meld.belangrijk { border-left-color: var(--down); background: rgba(232,101,79,.07); }" +
    ".meld small { display: block; color: var(--dimmer); font-size: 0.7rem; margin-bottom: 2px; }" +
    ".meldleeg { padding: 28px 16px; text-align: center; color: var(--dim); font-size: 0.86rem; }";
  document.head.appendChild(css);

  var knop = document.createElement("button");
  knop.type = "button";
  knop.className = "navknop";
  knop.id = "navMeldingen";
  knop.setAttribute("aria-label", "Meldingen");
  knop.innerHTML =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9Z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>' +
    'Meldingen<i class="navstip" hidden></i>';
  nav.appendChild(knop);
  var stip = knop.querySelector(".navstip");

  var paneel = document.createElement("div");
  paneel.className = "meldpaneel";
  paneel.hidden = true;
  paneel.setAttribute("role", "dialog");
  paneel.setAttribute("aria-label", "Meldingen");
  paneel.innerHTML =
    '<div class="meldkop"><span>Meldingen</span>' +
    '<label><input type="checkbox" id="meldAlleenBelangrijk"> Alleen belangrijk</label></div>' +
    '<div class="meldlijst" id="meldLijst"></div>';
  document.body.appendChild(paneel);
  var lijst = paneel.querySelector("#meldLijst");
  var alleenBelangrijk = paneel.querySelector("#meldAlleenBelangrijk");

  var laatsteData = null;

  function tijdTekst(t) {
    var d = new Date(t * 1000), nu = new Date();
    var tijd = d.toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" });
    if (d.toDateString() === nu.toDateString()) { return "Vandaag " + tijd; }
    return d.toLocaleDateString("nl-NL", { day: "numeric", month: "short" }) + " " + tijd;
  }

  function teken() {
    lijst.textContent = "";
    var items = (laatsteData && laatsteData.meldingen) || [];
    if (alleenBelangrijk.checked) { items = items.filter(function (m) { return m.niveau === "belangrijk"; }); }
    if (!items.length) {
      var leeg = document.createElement("div");
      leeg.className = "meldleeg";
      leeg.textContent = alleenBelangrijk.checked ? "Geen belangrijke meldingen. Rustig." : "Nog geen meldingen.";
      lijst.appendChild(leeg);
      return;
    }
    items.forEach(function (m) {
      var rij = document.createElement("div");
      rij.className = "meld" + (m.niveau === "belangrijk" ? " belangrijk" : "");
      var klein = document.createElement("small");
      klein.textContent = tijdTekst(m.t);
      var tekst = document.createElement("span");
      tekst.textContent = m.tekst;
      rij.appendChild(klein); rij.appendChild(tekst);
      lijst.appendChild(rij);
    });
  }

  function haal(markeerGelezen) {
    return fetch("/api/meldingen", { headers: { "Accept": "application/json" }, credentials: "same-origin" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) {
        if (!data) { return; }
        laatsteData = data;
        stip.hidden = !(data.ongelezen_belangrijk > 0) || markeerGelezen === true;
        if (!paneel.hidden) { teken(); }
      })
      .catch(function () {});
  }

  function markeerGelezen() {
    fetch("/api/meldingen/gelezen", { method: "POST", credentials: "same-origin" }).catch(function () {});
    stip.hidden = true;
  }

  function sluit() { paneel.hidden = true; knop.classList.remove("open"); }

  knop.addEventListener("click", function (e) {
    e.stopPropagation();
    if (!paneel.hidden) { sluit(); return; }
    paneel.hidden = false;
    knop.classList.add("open");
    teken();
    haal(true).then(function () { teken(); markeerGelezen(); });
  });
  paneel.addEventListener("click", function (e) { e.stopPropagation(); });
  alleenBelangrijk.addEventListener("change", teken);
  document.addEventListener("click", sluit);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { sluit(); } });

  haal();
  setInterval(function () { if (!document.hidden && paneel.hidden) { haal(); } }, 30000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden && paneel.hidden) { haal(); } });
})();
</script>
